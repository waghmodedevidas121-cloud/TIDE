<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1622" />
    <meta
      name="description"
      content="TIDE - browser .io-style territory control game. Phase 1 prototype."
    />
    <title>TIDE</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060d15;
        color: #e8f1f8;
        font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game {
        position: fixed;
        inset: 0;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #060d15;
        z-index: 10;
        transition: opacity 0.4s ease;
      }

      #boot h1 {
        font-size: 54px;
        letter-spacing: 14px;
        font-weight: 300;
        color: #4fc3f7;
      }

      #boot p {
        font-size: 14px;
        letter-spacing: 2px;
        color: #6f8296;
      }

      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <h1>TIDE</h1>
      <p>loading bathymetry...</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
